{{/* Page tags */}}

{{- if .Param "showTags" }}
	{{- $taxonomy := "tags" }}
	{{- with .Param $taxonomy }}    
		<div class="single-tags">
			{{- range $index, $tag := . }}
				{{- with $.Site.GetPage (printf "/%s/%s" $taxonomy $tag) -}}
					<span>
						<a href="{{ .Permalink }}">#{{ .LinkTitle }}</a>
					</span>
				{{- end }}
			{{- end }}
		</div>
	{{- end }}
{{- end }}
