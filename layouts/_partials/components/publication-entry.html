<div class="post-line">

    {{ $dateFormat := "Jan 2006"}}
    {{ with .Site.Params.publicationDateFormat }}
    {{ $dateFormat = . }}
    {{ end }}

    <div>
        <p class="line-title">
            <a href="{{ .RelPermalink }}">
                {{ .Title }}
            </a>
        </p>

        <div class="line-summary">{{ delimit .Params.authors ", " " and " }}</div>

        {{ partial "badges.html" . }}
    </div>
</div>
